<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>latido.exe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700&family=Dancing+Script:wght@600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #020004;
    --pink: #ff2d78;
    --pink-soft: #ff7ab0;
    --text: #f4e9f0;
    --mono: "Courier New", Consolas, monospace;
    --sans: "Manrope", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --script: "Dancing Script", "Segoe Script", "Snell Roundhand", "Apple Chancery", "Brush Script MT", cursive;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--bg); overflow: hidden; }
  body {
    font-family: var(--sans);
    color: var(--text);
    background:
      radial-gradient(ellipse at 50% 50%, #0e0212 0%, #060009 55%, #020004 100%);
  }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
  canvas:active { cursor: grabbing; }
  #hint { position: fixed; left: 0; right: 0; bottom: 14px; text-align: center; z-index: 2; font-size: 10px; letter-spacing: .2em; color: #b58aa3; opacity: 0; transition: opacity 1.5s ease; pointer-events: none; }
  #hint.show { opacity: .85; }

  /* ---------- Стартовое окно ---------- */
  #boot {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    z-index: 5; transition: opacity .8s ease, transform .8s ease;
  }
  #boot.hide { opacity: 0; transform: scale(.94); pointer-events: none; }
  .boot-card {
    position: relative; width: min(300px, 80vw); padding: 28px 22px 22px;
    background: rgba(30, 6, 36, .65);
    border: 1px solid rgba(255, 45, 120, .35);
    border-radius: 6px; text-align: center;
    box-shadow: 0 0 40px rgba(255, 45, 120, .18), inset 0 0 30px rgba(255, 45, 120, .06);
    backdrop-filter: blur(6px);
  }
  .boot-card i { position: absolute; width: 10px; height: 10px; border: 1px solid var(--pink); }
  .boot-card i:nth-child(1) { top: -1px; left: -1px; border-right: 0; border-bottom: 0; }
  .boot-card i:nth-child(2) { top: -1px; right: -1px; border-left: 0; border-bottom: 0; }
  .boot-card i:nth-child(3) { bottom: -1px; left: -1px; border-right: 0; border-top: 0; }
  .boot-card i:nth-child(4) { bottom: -1px; right: -1px; border-left: 0; border-top: 0; }
  .boot-heart { width: 46px; height: 46px; margin: 0 auto 10px; filter: drop-shadow(0 0 10px var(--pink)); animation: idle 1.6s ease-in-out infinite; }
  @keyframes idle { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1); } }
  .boot-title { font-family: var(--mono); font-size: 17px; letter-spacing: .08em; font-weight: 700; }
  .boot-line { height: 2px; margin: 16px 0 12px; background: linear-gradient(90deg, transparent, var(--pink), #a855f7, transparent); opacity: .8; }
  .boot-sub { font-family: var(--mono); font-size: 10px; letter-spacing: .18em; color: #c9a5bb; margin-bottom: 16px; }
  #wake {
    width: 100%; padding: 12px 10px; cursor: pointer;
    font-family: var(--sans); font-weight: 700; font-size: 12px; letter-spacing: .12em; color: #fff;
    background: rgba(255, 45, 120, .18); border: 1px solid var(--pink); border-radius: 4px;
    box-shadow: 0 0 16px rgba(255, 45, 120, .35);
    transition: background .2s, box-shadow .2s;
  }
  #wake:hover, #wake:focus-visible { background: rgba(255, 45, 120, .35); box-shadow: 0 0 26px rgba(255, 45, 120, .6); outline: none; }

  /* ---------- Подпись под сердцем ---------- */
  #caption {
    position: fixed; left: 0; right: 0; bottom: max(8vh, 58px); text-align: center; z-index: 2;
    opacity: 0; transition: opacity 2s ease; pointer-events: none;
  }
  #caption.show { opacity: 1; }
  #caption small { display: block; font-size: 11px; letter-spacing: .34em; color: #b8a3b1; margin-bottom: 4px; font-weight: 500; }
  #caption span { font-family: var(--script); font-size: 30px; color: #fff; }
  #caption span b { font-weight: 600; color: #ff4f9a; text-shadow: 0 0 12px rgba(255, 45, 120, .6); }

  /* ---------- Письмо ---------- */
  #letterWrap {
    position: fixed; inset: 0; z-index: 10; display: flex; align-items: center; justify-content: center;
    padding: 20px; background: rgba(7, 2, 15, .45); backdrop-filter: blur(3px);
    opacity: 0; pointer-events: none; transition: opacity .8s ease;
  }
  #letterWrap.open { opacity: 1; pointer-events: auto; }
  .letter {
    width: min(420px, 100%); max-height: 80vh; display: flex; flex-direction: column;
    background: rgba(32, 8, 40, .92); border: 1px solid rgba(255, 45, 120, .4); border-radius: 10px;
    box-shadow: 0 0 50px rgba(255, 45, 120, .2);
  }
  .letter-head { display: flex; align-items: center; padding: 12px 16px; border-bottom: 1px solid rgba(255, 45, 120, .2); }
  .letter-head b { flex: 1; font-family: var(--mono); font-size: 11px; letter-spacing: .25em; color: var(--pink); }
  .icon-btn { background: none; border: 0; color: #d9b9cb; font-size: 18px; cursor: pointer; padding: 2px 8px; border-radius: 4px; }
  .icon-btn:hover, .icon-btn:focus-visible { color: #fff; background: rgba(255, 255, 255, .08); outline: none; }
  .letter-body { padding: 18px 18px 8px; overflow-y: auto; min-height: 150px; }
  #letterText { white-space: pre-wrap; font-size: 15px; line-height: 1.65; }
  #letterText.typing::after { content: "▍"; color: var(--pink); animation: blink .8s steps(1) infinite; margin-left: 1px; }
  @keyframes blink { 50% { opacity: 0; } }
  #letterEdit { display: none; width: 100%; min-height: 200px; resize: vertical; padding: 10px; font: inherit; font-size: 15px; line-height: 1.5;
    color: var(--text); background: rgba(0, 0, 0, .35); border: 1px solid rgba(255, 45, 120, .4); border-radius: 6px; }
  #letterEdit:focus { outline: 2px solid var(--pink); }
  .letter-foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 16px 14px; }
  .letter-foot em { font-family: var(--mono); font-size: 11px; color: #b58aa3; font-style: normal; margin-left: auto; }
  #saveBtn { display: none; padding: 8px 12px; font-size: 12px; font-weight: 700; color: #fff; cursor: pointer;
    background: rgba(255, 45, 120, .25); border: 1px solid var(--pink); border-radius: 4px; }
  #reopen {
    position: fixed; right: 18px; bottom: 18px; z-index: 6; width: 44px; height: 44px; border-radius: 50%;
    font-size: 18px; cursor: pointer; color: #fff; background: rgba(255, 45, 120, .22); border: 1px solid var(--pink);
    box-shadow: 0 0 16px rgba(255, 45, 120, .4); display: none;
  }
  #reopen.show { display: block; }
</style>
</head>
<body>

<canvas id="c"></canvas>

<div id="boot">
  <div class="boot-card">
    <i></i><i></i><i></i><i></i>
    <svg class="boot-heart" viewBox="0 0 32 32" aria-hidden="true">
      <defs><linearGradient id="hg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff7ab0"/><stop offset="1" stop-color="#ff2d78"/></linearGradient></defs>
      <path d="M16 28 C4 19 2 11 7 7.5 C11 5 14.5 7 16 10 C17.5 7 21 5 25 7.5 C30 11 28 19 16 28Z" fill="url(#hg)"/>
    </svg>
    <div class="boot-title">latido.exe</div>
    <div class="boot-line"></div>
    <div class="boot-sub">LISTO PARA AMAR.</div>
    <button id="wake" type="button">DESPERTAR LATIDO</button>
  </div>
</div>

<div id="caption"><small>PROGRAMÉ ESTE LATIDO</small><span>para <b>ti</b> 💗</span></div>

<div id="hint">ARRASTRA PARA GIRAR ↔</div>

<div id="letterWrap">
  <div class="letter" role="dialog" aria-label="Carta">
    <div class="letter-head">
      <b>PARA TI</b>
      <button class="icon-btn" id="editBtn" type="button" title="Escribir mi carta" aria-label="Escribir mi carta">✎</button>
      <button class="icon-btn" id="closeBtn" type="button" aria-label="Cerrar">✕</button>
    </div>
    <div class="letter-body">
      <div id="letterText"></div>
      <textarea id="letterEdit" placeholder="Напиши здесь своё письмо…"></textarea>
    </div>
    <div class="letter-foot">
      <button id="saveBtn" type="button">Guardar y reproducir</button>
      <em>— made with love</em>
    </div>
  </div>
</div>

<button id="reopen" type="button" aria-label="Abrir carta">✉</button>

<script>
/* ============================================================
   ТВОЁ ПИСЬМО. Измени текст между обратными кавычками ` `
   (можно на русском). Перенос строки = Enter.
   Ещё письмо можно написать прямо на странице — кнопка ✎.
   ============================================================ */
let LETTER = `Para ti,

Cada latido de este corazón lleva tu nombre.

(Здесь будет твоё письмо. Замени этот текст.)

— Tu nombre`;

/* Слова, которые падают и собираются в сердце */
const WORDS = [
  "I love you", "I love you", "Love you", "Je t'aime", "Forever", "Always",
  "Sweetheart", "Love", "You", "Me & you"
];

/* Время (сек) от нажатия кнопки до появления письма */
const LETTER_AT = 16;

/* ------------------------------------------------------------ */
const $ = id => document.getElementById(id);
const canvas = $("c"), ctx = canvas.getContext("2d");
let W, H;

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W * dpr; canvas.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener("resize", resize);
resize();

/* Сохранённое письмо (если ты писал его на странице) */
try {
  const saved = localStorage.getItem("latido_letter");
  if (saved) LETTER = saved;
} catch (e) {}

/* ---------- Настройки сердца ---------- */
const THICK = 9;        /* толщина сердца: больше = круглее */
const N_WORDS = 88;     /* сколько слов */
const N_RING = 30;      /* из них по контуру */
const N_HEARTS = 8;     /* маленькие красные сердечки ♥ */
const FOCUS = 5;        /* какая глубина в фокусе, остальное размыто */

const heartX = t => 16 * Math.pow(Math.sin(t), 3);
const heartY = t => 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);

const items = [];
for (let i = 0; i < N_WORDS + N_HEARTS; i++) {
  const glyph = i >= N_WORDS;
  const ring = !glyph && i < N_RING;
  const t = ring ? (i / N_RING) * Math.PI * 2 + (Math.random() - .5) * .18 : Math.random() * Math.PI * 2;
  const k = ring ? .97 + Math.random() * .05 : Math.min(.98, Math.sqrt(Math.random()));
  const side = Math.random() < .5 ? 1 : -1;
  const hz = ring ? (Math.random() - .5) * 3 : side * THICK * Math.sqrt(Math.max(0, 1 - k * k)) * (.65 + Math.random() * .35);
  items.push({
    text: glyph ? "♥" : WORDS[Math.floor(Math.random() * WORDS.length)],
    glyph,
    hx: heartX(t) * k, hy: heartY(t) * k, hz,
    sx: Math.random(), sy: .06 + Math.random() * .9, sz: -45 + Math.random() * 75,
    delay: Math.random() * 2.6, fall: 1.6 + Math.random() * 1.6,
    asmDelay: Math.random() * 1.0, phase: Math.random() * 6.28,
    m: glyph ? 1 + Math.random() * .6 : .75 + Math.random() * .6,
    x1: 0, y1: 0, a1: 0, b1: 0, s1: 0, ae: 0, px: 0, py: 0, z: 0, pr: 1, vis: false
  });
}
const order = items.slice();

/* мелкая «пыль» на фоне */
const stars = [];
for (let i = 0; i < 35; i++) stars.push({ x: Math.random(), y: Math.random(), ph: Math.random() * 6.28, sp: .4 + Math.random() * 1.2 });

try { document.fonts.load("600 14px Manrope"); } catch (e) {}

const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
const easeOut = t => 1 - Math.pow(1 - t, 3);
const easeInOut = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;

let running = false, t0 = 0, last = 0;
let yaw = 0, pitch = .1, yawVel = 0;
let dragging = false, lastX = 0, lastY = 0;
let captionShown = false, letterShown = false, hintShown = false;

/* Вращение сердца: тяни мышью или пальцем */
canvas.addEventListener("pointerdown", e => {
  if (!running) return;
  dragging = true; lastX = e.clientX; lastY = e.clientY;
  try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
  $("hint").classList.remove("show");
});
canvas.addEventListener("pointermove", e => {
  if (!dragging) return;
  const dx = e.clientX - lastX, dy = e.clientY - lastY;
  lastX = e.clientX; lastY = e.clientY;
  yaw += dx * .012;
  pitch = clamp(pitch + dy * .01, -1.1, 1.1);
  yawVel = lerp(yawVel, clamp(dx * .012 * 50, -8, 8), .5);
});
const endDrag = () => { dragging = false; };
canvas.addEventListener("pointerup", endDrag);
canvas.addEventListener("pointercancel", endDrag);

/* Слово: чёткое со свечением или размытое (глубина резкости) */
function drawWord(text, x, y, size, r, g, b, alpha, blur, k, glyph) {
  ctx.font = `${glyph ? 700 : 600} ${size.toFixed(1)}px Manrope, system-ui, sans-serif`;
  if (blur > .8) {
    const OFF = 30000;
    ctx.shadowColor = `rgba(${r},${g},${b},${clamp(alpha * 1.6, 0, 1).toFixed(3)})`;
    ctx.shadowBlur = blur * 2.2 * k;
    ctx.shadowOffsetX = OFF;
    ctx.fillStyle = "#000";
    ctx.fillText(text, x - OFF / k, y);
    ctx.shadowOffsetX = 0;
  } else {
    ctx.shadowColor = `rgba(255,30,120,${(alpha * .85).toFixed(3)})`;
    ctx.shadowBlur = 8 * k;
    ctx.fillStyle = `rgba(${r},${g},${b},${alpha.toFixed(3)})`;
    ctx.fillText(text, x, y);
  }
}

function frame(now) {
  if (!running) return;
  const time = (now - t0) / 1000;
  const dt = Math.min((now - last) / 1000, .05);
  last = now;
  const k = canvas.width / W;
  ctx.clearRect(0, 0, W, H);

  /* большое сердце: ~68% высоты экрана, но не шире экрана */
  const scale = Math.min(H * .68 / 31, W * .92 / 37);
  const baseFont = clamp(scale * .85, 9, 21);
  const F = 75;
  const cx = W / 2, cy = H * .47;

  const rotRamp = clamp((time - 5.6) / 2, 0, 1);
  if (!dragging) {
    yawVel += (.6 * rotRamp - yawVel) * (1 - Math.exp(-dt * 1.5));
    yaw += yawVel * dt;
    pitch += (.1 - pitch) * (1 - Math.exp(-dt * 1.2));
  }
  const cosY = Math.cos(yaw), sinY = Math.sin(yaw);
  const cosP = Math.cos(pitch), sinP = Math.sin(pitch);

  const ready = clamp((time - 4.2) / 2.2, 0, 1);
  const bt = (time % 1.15) / 1.15;
  const beat = Math.exp(-Math.pow((bt - .1) * 9, 2)) + .7 * Math.exp(-Math.pow((bt - .32) * 9, 2));
  const pulse = 1 + .06 * beat * ready;

  /* фон: тёмное малиновое свечение за сердцем и редкая пыль */
  ctx.shadowBlur = 0;
  if (ready > 0) {
    const ga = (.30 + .10 * beat) * ready;
    const gl = ctx.createRadialGradient(cx, cy, 0, cx, cy, scale * 26);
    gl.addColorStop(0, `rgba(130,12,75,${ga.toFixed(3)})`);
    gl.addColorStop(1, "rgba(130,12,75,0)");
    ctx.fillStyle = gl;
    ctx.fillRect(0, 0, W, H);
  }
  for (const st of stars) {
    const a = .08 + .2 * (.5 + .5 * Math.sin(time * st.sp + st.ph));
    ctx.fillStyle = `rgba(255,210,235,${a.toFixed(3)})`;
    ctx.fillRect(st.x * W, st.y * H, 1.3, 1.3);
  }

  for (const w of items) {
    const fp = clamp((time - w.delay) / w.fall, 0, 1);
    w.vis = fp > 0;
    if (!w.vis) continue;

    /* падение: облако слов на разной глубине */
    const pr0 = F / (F - w.sz);
    w.x1 = w.sx * W + Math.sin(time * .9 + w.phase) * 8 * pr0;
    w.y1 = -40 + (w.sy * H + 40) * easeOut(fp) + Math.sin(time * 1.1 + w.phase) * 4;
    w.s1 = baseFont * .8 * w.m * pr0;
    w.b1 = Math.abs(w.sz - FOCUS) / 9;
    w.a1 = Math.min(1, fp * 3) * clamp(.75 - Math.abs(w.sz - FOCUS) / 70, .22, .75);
    w.ae = easeInOut(clamp((time - 3.4 - w.asmDelay) / 2.0, 0, 1));

    /* точка на 3D-сердце */
    const X = w.hx * pulse, Y = (w.hy + 2.5) * pulse, Z = w.hz * pulse;
    const xr = X * cosY + Z * sinY;
    const z1 = -X * sinY + Z * cosY;
    const yr = Y * cosP - z1 * sinP;
    const zr = Y * sinP + z1 * cosP;
    const pr = F / (F - zr);
    w.px = cx + xr * scale * pr;
    w.py = cy - yr * scale * pr;
    w.z = zr; w.pr = pr;
  }

  order.sort((a, c) => (a.ae > .5 ? a.z : a.sz) - (c.ae > .5 ? c.z : c.sz));

  ctx.textAlign = "center";
  ctx.textBaseline = "middle";

  for (const w of order) {
    if (!w.vis) continue;
    const front = clamp(w.z / 13, -1, 1) * .5 + .5;      /* 0 = сзади, 1 = спереди */
    const a2 = .22 + .78 * front;
    const b2 = Math.max(0, Math.abs(w.z - FOCUS) - 6) * .42;
    const x = lerp(w.x1, w.px, w.ae), y = lerp(w.y1, w.py, w.ae);
    const a = lerp(w.a1, a2, w.ae);
    const bl = lerp(w.b1, b2, w.ae);
    const size = lerp(w.s1, baseFont * w.m * w.pr, w.ae);

    let r = lerp(150, 255, front) | 0, g = lerp(18, 58, front) | 0, bb = lerp(95, 150, front) | 0;
    if (w.glyph) { r = 255; g = lerp(25, 50, front) | 0; bb = lerp(60, 95, front) | 0; }
    drawWord(w.text, x, y, size, r, g, bb, a, bl, k, w.glyph);
  }

  if (!captionShown && time > 5.6) { $("caption").classList.add("show"); captionShown = true; }
  if (!hintShown && time > 7.5) {
    hintShown = true;
    $("hint").classList.add("show");
    setTimeout(() => $("hint").classList.remove("show"), 7000);
  }
  if (!letterShown && time > LETTER_AT) { letterShown = true; openLetter(true); $("reopen").classList.add("show"); }

  requestAnimationFrame(frame);
}

$("wake").addEventListener("click", () => {
  $("boot").classList.add("hide");
  running = true;
  t0 = last = performance.now();
  requestAnimationFrame(frame);
});

/* ---------------- Письмо ---------------- */
let typer = null;
function typeLetter() {
  clearInterval(typer);
  const el = $("letterText");
  const chars = Array.from(LETTER);
  let i = 0;
  el.textContent = "";
  el.classList.add("typing");
  typer = setInterval(() => {
    i++;
    el.textContent = chars.slice(0, i).join("");
    if (i >= chars.length) { clearInterval(typer); el.classList.remove("typing"); }
  }, 45);
}

function openLetter(replay) {
  $("letterWrap").classList.add("open");
  if (replay) typeLetter();
}
function closeLetter() {
  $("letterWrap").classList.remove("open");
  leaveEdit();
}
function enterEdit() {
  clearInterval(typer);
  $("letterText").style.display = "none";
  $("letterEdit").style.display = "block";
  $("letterEdit").value = LETTER;
  $("saveBtn").style.display = "inline-block";
  $("letterEdit").focus();
}
function leaveEdit() {
  $("letterText").style.display = "";
  $("letterEdit").style.display = "none";
  $("saveBtn").style.display = "none";
}

$("closeBtn").addEventListener("click", closeLetter);
$("reopen").addEventListener("click", () => openLetter(true));
$("editBtn").addEventListener("click", enterEdit);
$("saveBtn").addEventListener("click", () => {
  const v = $("letterEdit").value.trim();
  if (v) {
    LETTER = v;
    try { localStorage.setItem("latido_letter", v); } catch (e) {}
  }
  leaveEdit();
  typeLetter();
});
</script>
</body>
</html>
